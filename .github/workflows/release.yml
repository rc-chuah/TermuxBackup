name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            clang: aarch64-linux-android21-clang
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            clang: armv7a-linux-androideabi21-clang
          - target: i686-linux-android
            abi: x86
            clang: i686-linux-android21-clang
          - target: x86_64-linux-android
            abi: x86_64
            clang: x86_64-linux-android21-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          TARGET="${{ matrix.target }}"
          CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}"
          AR_TOOL="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')

          export "CARGO_TARGET_${TARGET_UPPER}_LINKER=$CLANG"
          export "CC_${TARGET_UPPER}=$CLANG"
          export "AR_${TARGET_UPPER}=$AR_TOOL"

          cargo build --release --target "$TARGET"

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/termux-backup" "dist/termux-backup-${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-backup-${{ matrix.abi }}
          path: dist/termux-backup-${{ matrix.abi }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/termux-backup-*
          generate_release_notes: true
